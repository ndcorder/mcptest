[project]
name = "pytest-mcptest"
version = "0.2.0"
description = "A pytest plugin for testing MCP servers without spinning up an LLM"
readme = "README.md"
authors = [
    { name = "Nicolas Corder", email = "ndcorder@pm.me" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pytest", "mcp", "testing", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.24.0",
    "mcp>=1.0,<3",
    "pydantic>=2.0",
    "pytest>=7.0",
]

[project.entry-points.pytest11]
mcptest = "mcptest.plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcptest"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["mcptest"]

[tool.coverage.report]
show_missing = true
